# SPDX-License-Identifier: MIT
# Apache mTLS snippet for eduVPN Posture Check
#
# Add these directives INSIDE the existing <VirtualHost *:443> block
# of your eduVPN server's Apache configuration.
#
# Location: /etc/apache2/sites-available/<hostname>.conf
#
# IMPORTANT: These must be at the VirtualHost level (NOT inside a <Location>
# block) because Go's TLS 1.3 implementation does not support post-handshake
# client certificate requests. Placing them at the vhost level means the
# client cert is requested during the initial TLS handshake.

    # --- mTLS Posture Check Configuration ---

    # Trust the step-ca CA bundle for verifying client device certificates.
    # This file must contain the root CA and any intermediate CA certificates.
    SSLCACertificateFile /etc/eduvpn-mtls/ca-bundle.crt

    # Request a client certificate but do not require one.
    # "optional" means connections without a cert are still accepted —
    # the posture check in PHP handles enforcement and returns proper
    # JSON error responses.
    SSLVerifyClient optional

    # Allow root CA → intermediate CA → device cert chain (depth 2).
    SSLVerifyDepth 2

    # Export SSL environment variables to PHP so the application can
    # read SSL_CLIENT_VERIFY and SSL_CLIENT_S_DN_CN.
    SSLOptions +StdEnvVars
